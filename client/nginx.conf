# ==============================================================================
# SPRINTLY FRONTEND NGINX CONFIGURATION (Production SPA Server)
# ==============================================================================
# Purpose:
#   1. Serves compiled Vite React static assets with blazing fast performance.
#   2. Handles client-side SPA routing (React Router fallback to index.html).
#   3. Enables dynamic gzip compression to minimize network payload.
#   4. Enforces HTTP security headers.
#   5. Implements optimized caching (immutable hashed assets vs. no-cache index.html).
# ==============================================================================

server {
    # Port on which Nginx listens inside the container
    listen 80;
    listen [::]:80;
    server_name _;

    # Root directory where compiled Vite assets are copied
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. Gzip Compression
    # --------------------------------------------------------------------------
    # Compresses text-based assets on the fly, drastically reducing transfer size
    # and accelerating initial page load times.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------------------------
    # 2. Security Headers (Defense-in-Depth)
    # --------------------------------------------------------------------------
    # Prevents clickjacking by restricting framing to the same origin
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevents browsers from MIME-sniffing a response away from the declared content-type
    add_header X-Content-Type-Options "nosniff" always;

    # Enables browser XSS filtering
    add_header X-XSS-Protection "1; mode=block" always;

    # Controls how much referrer information is sent with requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 3. Cache Policy for Vite Static Assets (/assets/*)
    # --------------------------------------------------------------------------
    # Vite bundles JS/CSS files with unique content hashes (e.g. index-a8f1b2.js).
    # Since the URL changes whenever the code changes, these files can be cached
    # aggressively for 1 year with the 'immutable' directive.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Cache Policy for index.html
    # --------------------------------------------------------------------------
    # index.html points to the latest hashed JS/CSS bundles. It MUST NEVER be cached,
    # so users immediately receive new releases without needing hard browser refreshes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --------------------------------------------------------------------------
    # 5. Lightweight Health Check
    # --------------------------------------------------------------------------
    # Docker, load balancers, or uptime monitors can probe this endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # 7. Reverse Proxy to Backend API (Optional Same-Origin Routing)
    # --------------------------------------------------------------------------
    # Proxies /api requests directly to the server container over Docker's internal
    # network. This eliminates cross-origin CORS issues and cross-port cookie quirks.
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxies WebSocket connections for real-time events
    location ~* ^/(socket\.io|realtime)/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # 8. Single Page Application (SPA) Fallback
    # --------------------------------------------------------------------------
    # In a Single Page App, client-side routing (React Router) manages URLs like
    # /projects, /calendar, /settings.
    # If a user refreshes or bookmarks a subpath, Nginx checks if a real static file
    # exists ($uri) or directory ($uri/). If neither exists, it serves /index.html,
    # allowing React Router to handle the route in the browser instead of throwing a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
